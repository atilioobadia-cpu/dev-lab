name: Reusable Repository CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect project stacks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      php: ${{ steps.detect.outputs.php }}
      frappe: ${{ steps.detect.outputs.frappe }}
      pytest_config: ${{ steps.detect.outputs.pytest_config }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect supported project manifests
        shell: bash
        run: |
          echo "node=$([[ -f package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([[ -f pyproject.toml || -f requirements.txt || -f setup.py ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "php=$([[ -f composer.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frappe=$([[ -f hooks.py ]] || find . -path './.git' -prune -o -name hooks.py -print -quit | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -f pytest.ini ] || [ -f pytest.toml ] || [ -f tox.ini ] || { [ -f pyproject.toml ] && grep -q "^\\[tool.pytest.ini_options\\]" pyproject.toml; } || { [ -f setup.cfg ] && grep -q "^\\[tool:pytest\\]" setup.cfg; }; then echo "pytest_config=true" >> "$GITHUB_OUTPUT"; else echo "pytest_config=false" >> "$GITHUB_OUTPUT"; fi
          test -n "$(git ls-files)" || { echo "Repository contains no tracked files"; exit 1; }

  node:
    name: Node.js checks
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci;
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile;
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable;
          else npm install; fi
      - name: Run available quality checks
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.cjs ] || [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yml ] || [ -f .eslintrc.yaml ]; then
              CI=1 npm run lint
            else
              echo "Lint script exists but no ESLint configuration is committed; skipping interactive lint setup."
            fi
          fi
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then npm run typecheck; fi
          if node -e "const s=require('./package.json').scripts?.test || ''; process.exit(s && !s.includes('no test specified') ? 0 : 1)"; then CI=1 npm test; else echo "No real test script configured; skipping placeholder test command."; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then CI=1 npm run build; fi

  python:
    name: Python checks
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ needs.detect.outputs.frappe }}" != "true" ] && [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "Skipping PyPI requirements install for Frappe app or no requirements file."; fi
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run portable pytest suite
        if: needs.detect.outputs.frappe != 'true' && needs.detect.outputs.pytest_config == 'true'
        shell: bash
        run: |
          set +e
          test_files=$(find . -type f -name 'test_*.py' \
            ! -name 'test_mic.py' ! -name 'test_audio*.py' ! -name 'test_camera*.py' \
            -not -path './.git/*' -not -path './.venv/*' -not -path './venv/*')
          if [ -z "$test_files" ]; then
            echo "No portable pytest files found; syntax validation completed."
            exit 0
          fi
          pytest -q $test_files
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests were collected; syntax validation completed."
          else
            exit "$status"
          fi
      - name: Explain skipped pytest suite
        if: needs.detect.outputs.frappe == 'true' || needs.detect.outputs.pytest_config != 'true'
        run: echo "No portable pytest configuration was found, or this is a Frappe app. Generic pytest is skipped; Python syntax validation has run."

  php:
    name: PHP checks
    needs: detect
    if: needs.detect.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish
      - name: Lint PHP sources
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 php -l

  repository:
    name: Repository integrity
    needs: detect
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked repository content
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git ls-files)"
          git diff --check
          echo "Repository integrity checks passed."
